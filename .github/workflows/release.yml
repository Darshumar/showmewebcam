name: Build/Release

on:
  push:
    tags:
      - 'v*'
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILDROOT_DIR: 'buildroot'
      BR2_DL_DIR: ${{ github.workspace }}/dl

    strategy:
      fail-fast: false
      matrix:
        raspberry: ['raspberrypi0', 'raspberrypi0w']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc cpio file rsync unzip wget libssl-dev

      - name: Determine versions
        run: |
          git fetch --depth=1 origin +refs/tags/*:refs/tags/* || true
          echo "SMW_VERSION=$(buildroot/support/scripts/setlocalversion)" >> "$GITHUB_ENV"
          echo "BUILDROOT_VERSION=$(git rev-parse --short HEAD:${BUILDROOT_DIR})" >> "$GITHUB_ENV"

      # Only the source downloads are cached: a full output/ directory is
      # too large for the GitHub cache and goes stale quickly anyway.
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('configs/*', 'package/**/*.mk') }}
          restore-keys: |
            dl-${{ env.BUILDROOT_VERSION }}-
            dl-

      - name: Build Image
        run: |
          bash build-showmewebcam.sh ${{ matrix.raspberry }}
          cp output/${{ matrix.raspberry }}/images/sdcard.img sdcard-${{ matrix.raspberry }}-${{ env.SMW_VERSION }}.img

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: sdcard-${{ matrix.raspberry }}-${{ env.SMW_VERSION }}.img
          path: sdcard-${{ matrix.raspberry }}-${{ env.SMW_VERSION }}.img

      - name: Prepare Release Image
        if: startsWith(github.ref, 'refs/tags/v')
        run: gzip -k sdcard-${{ matrix.raspberry }}-${{ env.SMW_VERSION }}.img

      - name: Store Release Image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.raspberry }}
          path: sdcard-${{ matrix.raspberry }}-${{ env.SMW_VERSION }}.img.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Changelog
        run: |
          printf "What's new:\n\n" > CHANGELOG.md
          git log $(git describe --tags --abbrev=0 HEAD^)..${{ github.ref }} --no-merges --pretty=format:"- %s" >> CHANGELOG.md

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create checksums file
        run: sha256sum sdcard* > CHECKSUMS.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            sdcard*
            CHECKSUMS.sha256
